name: 镜像同步到 AtomGit & Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    name: 同步代码镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史（含所有分支与标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 SSH 私钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}

      - name: 写入 known_hosts（AtomGit / Gitee）
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 atomgit.com >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -t rsa,ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: 推送镜像到 AtomGit
        run: |
          git remote add atomgit git@atomgit.com:serried-ranges/xiaoliuren-KnowledgePointsCompilation.git
          # 从 refs/remotes/origin/* 推送（含全部分支），避免 refs/heads/* 只含检出分支
          # 导致 --prune 误删远端默认分支 main 而被拒绝
          git push --prune --force atomgit 'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

      - name: 推送镜像到 Gitee
        # 说明：海外运行器向 Gitee 推"大仓"（含 >50MB 扫描件）易超时（曾 57 分钟仍 exit 128）；
        #       故本步设为"允许失败"——Gitee 的可靠同步由维护者本机 `git push`（origin 已配 3 个 push 地址）完成。
        continue-on-error: true
        run: |
          git remote add gitee git@gitee.com:serried-ranges/xiaoliuren-KnowledgePointsCompilation.git
          git push --prune --force gitee 'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

      - name: 完成通知
        run: |
          echo "镜像流程结束（AtomGit 由本工作流同步；Gitee 允许失败，可靠同步由本机多 push 完成）"
          echo "GitHub 全部分支: $(git branch -r | tr -d ' ' | tr '\n' ' ')"
